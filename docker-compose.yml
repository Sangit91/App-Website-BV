services:
  # Frontend: Vite dev server (internal only, proxied by nginx)
  public-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bvdh-frontend
    expose:
      - "8000"  # internal only — accessed via nginx, not published
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api  # same-origin via nginx
      - PORT=8000
      - API_HOST=admin-api
      - API_PORT=8001
      - DISABLE_HMR=true
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - admin-api
    networks:
      - bvdh-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend: Express API server (internal only)
  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bvdh-backend
    expose:
      - "8001"  # internal only — accessed via nginx, not published
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:devpass@db:5432/bvdh_db?schema=public
      - JWT_SECRET=dev-secret-change-in-production-min-32-chars
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production
      - PORT=8001
    volumes:
      - ./server:/app/server
      - ./prisma:/app/prisma
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bvdh-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["npx", "tsx", "watch", "server.ts"]

  # Database: PostgreSQL (internal only)
  db:
    image: postgres:16-alpine
    container_name: bvdh-db
    expose:
      - "5432"  # internal only — not published to host
    environment:
      - POSTGRES_DB=bvdh_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=devpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - bvdh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bvdh_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx: Reverse proxy (only public entrypoint)
  nginx:
    image: nginx:alpine
    container_name: bvdh-nginx
    ports:
      - "8443:443"  # ONLY public port — HTTPS to avoid conflicts with other apps on 80/443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./nginx/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
      - ./public:/usr/share/nginx/html:ro  # Static assets (if any)
    depends_on:
      - public-web
      - admin-api
    networks:
      - bvdh-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bvdh-network:
    driver: bridge

volumes:
  postgres_data:
    name: bvdh-postgres-data
  backend_uploads:
    name: bvdh-backend-uploads